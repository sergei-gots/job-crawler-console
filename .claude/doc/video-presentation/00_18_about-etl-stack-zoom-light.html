<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf8">
<title>Job-Crawler-Demo — About: ETL + Stack (Light, animated)</title>
<style>
  :root {
    --paper: #f2f5f4;
    --paper-raised: #ffffff;
    --ink-soft: #4e5f5b;
    --line: #d7dedc;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  .slide {
    width: 1280px;
    height: 720px;
    position: relative;
    background: var(--paper);
    overflow: hidden;
  }

  /* Fixed browser-frame chrome: stays put while the page content underneath zooms/pans,
     matching how a real browser's own UI never scales with page zoom. */
  /* The fake browser chrome is now PART of the zoomed/panned composition (a sibling of the
     screenshot <img>, both inside .zoom-wrap) - it scales and moves with the page content,
     the way zooming into a single photo of "browser window + page" would, rather than being
     fixed UI overlaying independently-moving content underneath. */
  .frame-titlebar {
    position: absolute;
    top: -40px; left: 0; right: 0;
    height: 40px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    background: #eef1f0;
    border-bottom: 1px solid var(--line);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #e5645b; }
  .dot.y { background: #e8b64a; }
  .dot.g { background: #58b368; }
  .frame-url {
    margin-left: 8px;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace;
    font-size: 15px;
    color: var(--ink-soft);
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 13px;
    flex: 1;
  }

  .viewport {
    position: absolute;
    top: 0; left: 0;
    width: 1280px;
    height: 720px;
    overflow: hidden;
  }
  .zoom-wrap {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
    animation: zoom-pan 9.51s both;
  }
  .zoom-wrap img { display: block; width: 1280px; height: 1050px; }

  /* Stage 0 (0-0.8s): full page (chrome + page as one photo), establishes "this is our own
     running app".
     Stage 1 (1.3-3.1s): the description paragraph - the beat's "domain" line.
     Stage 2 (4.1-6.6s): the ETL pipeline card, linear (not eased) continuous top-to-bottom
     drift for the *entire* hold, not a settle-then-nudge - reads as a steady glide.
     Stage 3 (7.3-9.51s): the stack list, same continuous linear drift technique; the
     paragraph above it is allowed to just barely enter at the very top of frame (orientation
     only), never the focus.
     Transitions between stages keep the softer cubic-bezier; only the two drift spans run
     linear so they don't read as jerky accelerate/decelerate.
     Values computed from live getBoundingClientRect() measurements, not guessed. */
  @keyframes zoom-pan {
    0%      { transform: translate(0px, 40px)           scale(1.0); animation-timing-function: cubic-bezier(.3,.7,.2,1); }
    8.412%  { transform: translate(0px, 40px)            scale(1.0); animation-timing-function: cubic-bezier(.3,.7,.2,1); }
    13.669% { transform: translate(-537.6px, 44.9px)     scale(2.3); animation-timing-function: cubic-bezier(.3,.7,.2,1); }
    32.597% { transform: translate(-537.6px, 44.9px)     scale(2.3); animation-timing-function: cubic-bezier(.3,.7,.2,1); }
    43.113% { transform: translate(76.8px, -155.9px)     scale(1.1); animation-timing-function: linear; }
    69.400% { transform: translate(76.8px, -454px)       scale(1.1); animation-timing-function: cubic-bezier(.3,.7,.2,1); }
    76.762% { transform: translate(-384px, -40px)        scale(2.0); animation-timing-function: linear; }
    100%    { transform: translate(-384px, -160px)       scale(2.0); }
  }
</style>
</head>
