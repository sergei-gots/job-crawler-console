<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf8">
<title>Job-Crawler-Demo — Domain: IT Job Vacancies (Light, animated)</title>
<style>
  :root {
    --paper: #f2f5f4;
    --paper-raised: #ffffff;
    --ink: #16211f;
    --accent: #127d76;
    --accent-deep: #0b5652;
    --accent-soft: #dcefec;
    --line: #d7dedc;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  .slide {
    width: 1280px;
    height: 720px;
    position: relative;
    background: var(--paper);
    overflow: hidden;
  }
  .zoom-wrap {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
    animation: zoom-pan 3.01s cubic-bezier(.25,.75,.2,1) both;
  }
  .zoom-wrap img { display: block; width: 1280px; height: 900px; }

  /* Stage 0: centers the real "jobs" section header. Stage 1: centers the real
     "software / qa / dba" link (href real query: ?cat=sof - what craigslistStrategy actually
     crawls). Values computed from live getBoundingClientRect() measurements, not guessed. */
  @keyframes zoom-pan {
    0%   { transform: translate(-1201.5px, 190px)   scale(2.0); }
    35%  { transform: translate(-1201.5px, 190px)   scale(2.0); }
    68%  { transform: translate(-2443.09px, -1906.1px) scale(3.4); }
    100% { transform: translate(-2443.09px, -1906.1px) scale(3.4); }
  }

  .hl-box {
    position: absolute;
    left: 396px; top: 310px; width: 488px; height: 100px;
    border: 3px solid var(--accent);
    border-radius: 8px;
    box-shadow: 0 0 0 4px var(--accent-soft);
    opacity: 0;
    animation: box-in 0.5s ease 2.05s both;
  }
  .hl-label {
    position: absolute;
    left: 396px; top: 264px;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace;
    font-size: 15px;
    font-weight: 600;
    color: var(--paper-raised);
    background: var(--accent-deep);
    border-radius: 6px;
    padding: 5px 11px;
    white-space: nowrap;
    opacity: 0;
    animation: box-in 0.5s ease 2.15s both;
  }
  @keyframes box-in {
    0%   { opacity: 0; transform: translateY(6px); }
    100% { opacity: 1; transform: translateY(0); }
  }
</style>
